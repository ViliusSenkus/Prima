<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" width="100" height="64">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fbff"/>
      <stop offset=".5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#0088aa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(4,4)" filter="url(#glow)">
    <polygon points="0,56 0,0 20,0 46,30 72,0 92,0 92,56 74,56 74,22 46,52 18,22 18,56" fill="url(#glass)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="3,3 17,3 17,25 3,25" fill="#ffffff" opacity=".45"/>
    <text x="54" y="58" font-family="Impact, 'Arial Black', sans-serif" font-size="30" font-style="italic" fill="#d800a6" stroke="#ffffff" stroke-width="2" paint-order="stroke">tv</text>
  </g>
</svg>
